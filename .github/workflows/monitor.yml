name: Monitor

# Cron is UTC and cannot follow DST. Europe/Ljubljana is UTC+1 in winter
# and UTC+2 in summer. Every 15 minutes from 06:00 through 20:45 UTC is
# about 07:00–21:45 Ljubljana in winter (08:00–22:45 in summer).
# Each run loops for 28 minutes, so it is still going when the next cron
# fires. cancel-in-progress is false: the running job is not killed, and the
# newest waiting run starts when it exits. An intermediate queued run can be
# replaced, but the 28-minute job already covers that slot. If GitHub starts
# a cron late, the scanner still emits signals that closed within 45 minutes.
# Inside the 28-minute loop the scanner polls every 5 minutes, and every
# 60 seconds during the Europe/Ljubljana session-open windows 08:45–10:00
# and 15:15–16:30, so M1 and M5 closes around London and the US cash open
# are evaluated then instead of waiting for the next M15 close.
on:
  schedule:
    - cron: "*/15 6-20 * * 1-5"
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Trajanje v minutah (1–30, privzeto 28)"
        required: false
        default: "28"

permissions:
  contents: read
  actions: write

concurrency:
  group: fn-price-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Namesti odvisnosti
        run: python -m pip install -r requirements.txt

      - name: Obnovi stanje
        id: state-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            state.json
            scanner_state.json
          # Unique key so every run saves a new snapshot. restore-keys picks
          # up the newest previous snapshot, which keeps one-shot events,
          # cooldowns, and the scanner daily caps across runs.
          key: fn-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fn-state-

      - name: Pripravi datoteke stanja
        run: |
          if [ -n "${{ steps.state-cache.outputs.cache-matched-key }}" ]; then
            echo "Stanje obnovljeno iz ${{ steps.state-cache.outputs.cache-matched-key }}"
          else
            echo "Ni prejšnjega stanja (prvi tek ali predpomnilnik je potekel)."
          fi
          test -f state.json || echo '{}' > state.json
          test -f scanner_state.json || echo '{}' > scanner_state.json

      - name: Zaženi monitor in skener
        env:
          FN_WEBHOOK_URL: ${{ secrets.FN_WEBHOOK_URL }}
          FN_WEBHOOK_KEY: ${{ secrets.FN_WEBHOOK_KEY }}
          DURATION_MINUTES: ${{ github.event.inputs.duration_minutes || '28' }}
          PYTHONUNBUFFERED: "1"
        run: bash run_session.sh "$DURATION_MINUTES"

      - name: Shrani stanje
        if: always() && steps.state-cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@v4
        with:
          path: |
            state.json
            scanner_state.json
          key: ${{ steps.state-cache.outputs.cache-primary-key }}
